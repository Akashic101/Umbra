[package]
name = "app"
version = "0.0.1"
description = "Local eclipse circumstances"
authors = ["you"]
license = ""
repository = "https://github.com/Akashic101/Umbra"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-geolocation = "2"
tauri-plugin-deep-link = "2"
